name: Android CI

on:
  push:
    branches:
      - main
    paths:
      - "apps/android/**"
      - "apps/web/**"
      - "packages/**"
      - ".github/workflows/android-ci.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "turbo.json"

  pull_request:
    paths:
      - "apps/android/**"
      - "apps/web/**"
      - "packages/**"
      - ".github/workflows/android-ci.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "turbo.json"

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync web build to Android
        run: pnpm sync:android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/android/android/**/*.gradle*', 'apps/android/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make Gradle Wrapper Executable
        working-directory: apps/android/android
        run: chmod +x gradlew

      - name: Verify Gradle Wrapper
        working-directory: apps/android/android
        run: ls -la

      - name: Build Debug APK
        working-directory: apps/android/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mizan-debug-apk
          path: apps/android/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14